# system-init workstation settings
# This file is sourced by the installer. Keep it free of secrets.

# Number of historical backup runs to retain. 0 disables pruning.
DOTFILES_BACKUP_KEEP=10

# Full 40-hex OpenPGP fingerprint used to sign backup manifests. Leave empty
# to write unsigned v2 snapshots (restore requires --allow-unsigned) or when
# using an older, legacy v1 snapshot. The private key must live in the user's
# GnuPG keyring, never in the repository or BACKUP_DIR.
BACKUP_SIGNING_KEY="${BACKUP_SIGNING_KEY:-}"

# Database and virtualization integration (opt-in). On Fedora these enable and
# start systemd services. On macOS they launch Postgres.app, start Valkey with
# Homebrew services, and verify UTM and Apple Hypervisor support.
ENABLE_DATABASE_SERVICES=0
ENABLE_VIRTUALIZATION_SERVICES=0

# Podman on macOS requires a VM. When enabled (default), the installer creates
# a machine if none exists and starts an existing stopped machine. Set to 0 to
# manage machines manually; doctor will then warn when none is running.
PODMAN_MACHINE_AUTO=1
PODMAN_MACHINE_NAME=default

# Profile used on macOS when --profile/--module are not supplied. macOS
# defaults to the full extended workstation and skips the profile prompt.
MACOS_DEFAULT_PROFILE=extended

# Flatpak. Only approved official Flathub endpoints are accepted:
# https://dl.flathub.org/repo/ and the official .flatpakrepo descriptors.
FLATPAK_REMOTE=flathub
FLATPAK_REPO_URL=https://dl.flathub.org/repo/flathub.flatpakrepo

# Optional application policy for direct --module runs. The extended profile
# always installs optional applications; the core profile always skips them.
INSTALL_OPTIONAL_APPS=0
