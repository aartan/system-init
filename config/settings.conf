# system-init workstation settings
# This file is sourced by the installer. Keep it free of secrets.

# Number of historical backup runs to retain. 0 disables pruning.
DOTFILES_BACKUP_KEEP=10

# Full 40-hex OpenPGP fingerprint used to sign backup manifests. Leave empty
# to write unsigned v2 snapshots (restore requires --allow-unsigned) or when
# using an older, legacy v1 snapshot. The private key must live in the user's
# GnuPG keyring, never in the repository or BACKUP_DIR.
BACKUP_SIGNING_KEY="${BACKUP_SIGNING_KEY:-}"

# Fedora system integration (opt-in). Enable these only if you want the
# installer to enable and start database or virtualization services.
ENABLE_DATABASE_SERVICES=0
ENABLE_VIRTUALIZATION_SERVICES=0

# Flatpak
FLATPAK_REMOTE=flathub
FLATPAK_REPO_URL=https://flathub.org/repo/flathub.flatpakrepo

# Installation policy. Optional desktop applications are opt-in.
INSTALL_OPTIONAL_APPS=0
